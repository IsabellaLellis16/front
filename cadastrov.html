<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Mecânica - Lista Veículos</title>
    <link rel="stylesheet" href="cadastrov.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <header>
        <nav>
            <ul>
                <p><a href="menu.html">Menu</a></p>
                <li><a href="listac.html">Clientes</a></li>
                <li><a href="agendamentos.html">Agendamentos</a></li>
                <li><a href=""></a>Fazer Agendamento</li>

                <img src="logo_mecanica.png" alt="Logo">

                <li><a href="cadastroc.html">Cadastrar Clientes</a></li>
                <li style="text-decoration: underline #703869 2.2px;"><a href="cadastrov.html">Cadastrar Veículos</a>
                </li>
            </ul>

            <div>
                <img src="perfil.png" alt="Perfil" class="img-perfil">
            </div>

            <button class="btn-sair"><a href="login.html">Sair</a></button>
        </nav>
    </header>

    <section>



        <form action="">
            <h2>Cadastrar Veículo:</h2>
            <fieldset>
                <div class="ano-fabricacao">
                    <label for="name"><b>Ano de Fabricação:</b></label>
                    <div class="input-item">
                        <i class="fa-solid fa-calendar"></i>
                        <input type="name" id="ano-fabricacao" placeholder="00/00/0000...">
                    </div>
                </div>

                <div class="marca">
                    <label for=""><b>Marca:</b></label>
                    <div class="input-item">
                        <i class="fa-solid fa-asterisk"></i>
                        <input id="marca" type="text" placeholder="Insira a marca...">
                    </div>
                </div>

                <div class="placa">
                    <label for="email"><b>Placa:</b></label>
                    <div class="input-item">
                        <i class="fa-solid fa-asterisk"></i>
                        <input type="text" id="placa" placeholder="Insira a placa...">
                    </div>
                </div>

                <div class="modelo">
                    <label for=""><b>Modelo:</b></label>
                    <div class="input-item">
                        <i class="fa-solid fa-asterisk"></i>
                        <input id="modelo" type="text" placeholder="Insira o modelo...">
                    </div>
                </div>

                <div class="cor">
                    <label for=""><b>Cor:</b></label>
                    <div class="input-item">
                        <i class="fa-solid fa-palette"></i>
                        <input id="cor" type="text" placeholder="insira a cor...">
                    </div>
                </div>
            </fieldset>

            <button class="btn-cadastro"><a href="#">Cadastrar</a></button>

        </form>
    </section>
</body>

</html>
