<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Mecânica - Cadastro Cliente</title>
    <link rel="stylesheet" href="cadastroc.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <p><a href="menu.html">Menu</a></p>
                <li><a href="listac.html">Clientes</a></li>
                <li><a href="agendamentos.html">Agendamentos</a></li>
                <li><a href=""></a>Fazer Agendamento</li>

                <img src="logo_mecanica.png" alt="Logo">

                <li style="text-decoration: underline #703869 2.2px;"><a href="cadastroc.html"></a>Cadastrar Clientes
                </li>
                <li><a href="cadastrov.html">Cadastrar Veículos</a></li>
            </ul>

            <div>
                <img src="perfil.png" alt="Perfil" class="img-perfil">
            </div>

            <button class="btn-sair"><a href="login.html">Sair</a></button>
        </nav>
    </header>
    <section>



        <form action="">
            <h2>Cadastrar Cliente:</h2>
            <fieldset>
                <div class="nome">
                    <label for="name"><b>Nome completo:</b></label>
                    <div class="input-item">
                        <i class="fa-solid fa-user"></i>
                        <input type="name" id="text" placeholder="Insira seu nome completo...">
                    </div>
                </div>

                <div class="telefone">
                    <label for=""><b>Telefone:</b></label>
                    <div class="input-item">
                        <i class="fa-solid fa-phone"></i>
                        <input id="telefone" type="text" placeholder="000000000...">
                    </div>
                </div>

                <div class="email">
                    <label for="email"><b>Email:</b></label>
                    <div class="input-item">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="text" placeholder="Insira seu email...">
                    </div>
                </div>

                <div class="cpf">
                    <label for=""><b>CPF:</b></label>
                    <div class="input-item">
                        <i class="fa-solid fa-folder"></i>
                        <input id="cpf" type="text" placeholder="00000000000...">
                    </div>
                </div>
            </fieldset>

            <button class="btn-cadastro"><a href="#"></a>Cadastrar</button>

        </form>
    </section>
</body>

</html>
